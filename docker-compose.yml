services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: aktiv
      POSTGRES_USER: aktiv
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aktiv -d aktiv"]
      interval: 5s
      timeout: 5s
      retries: 10

  db-backup:
    image: postgres:16
    restart: unless-stopped
    environment:
      PGHOST: db
      PGUSER: aktiv
      PGDATABASE: aktiv
      PGPASSWORD: ${DB_PASSWORD}
    volumes:
      - db_backups:/backups
    depends_on:
      db:
        condition: service_healthy
    command: >-
      sh -c 'while true; do
        file="/backups/aktiv-$$(date -u +%Y%m%dT%H%M%SZ).dump";
        if pg_dump -Fc -f "$$file"; then
          find /backups -maxdepth 1 -type f -name "aktiv-*.dump" -mtime +14 -delete;
          echo "Database backup created: $$file";
        else
          rm -f "$$file";
          echo "Database backup failed" >&2;
          sleep 300;
        fi;
        if [ -f "$$file" ]; then sleep 86400; fi;
      done'

  app:
    build:
      context: .
      dockerfile: app/Dockerfile
    restart: unless-stopped
    env_file: .env
    expose:
      - "8080"
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy

  proxy:
    image: caddy:2.9-alpine
    profiles: ["webhook"]
    restart: unless-stopped
    environment:
      WEBHOOK_DOMAIN: ${WEBHOOK_DOMAIN:-bot.example.com}
      CADDY_EMAIL: ${CADDY_EMAIL:-}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  pgdata:
  db_backups:
  caddy_data:
  caddy_config:

