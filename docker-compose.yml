services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: aktiv
      POSTGRES_USER: aktiv
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aktiv -d aktiv"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: ./app
    restart: unless-stopped
    env_file: .env
    expose:
      - "8080"
    depends_on:
      db:
        condition: service_healthy

  proxy:
    image: caddy:2.9-alpine
    profiles: ["webhook"]
    restart: unless-stopped
    environment:
      WEBHOOK_DOMAIN: ${WEBHOOK_DOMAIN:-bot.example.com}
      CADDY_EMAIL: ${CADDY_EMAIL:-}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  pgdata:
  caddy_data:
  caddy_config:

