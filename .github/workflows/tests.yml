name: Bot tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  ratings:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rating_test
          POSTGRES_PASSWORD: rating_test
          POSTGRES_DB: rating_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
        env:
          TEST_DATABASE_URL: postgresql://rating_test:rating_test@localhost:5432/rating_test
